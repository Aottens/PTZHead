[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

lib_deps =
  tzapu/WiFiManager@^2.0.17
  gin66/FastAccelStepper@^0.31.0
  cnmat/OSC@^3.5.8

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

build_unflags =
  -O2
  -flto
